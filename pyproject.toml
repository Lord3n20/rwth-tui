[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rwth-tui"
version = "0.1.0"
description = "Inoffizielle Terminal-Oberfläche für RWTHonline (Textual)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32", "textual>=8.2"]

[tool.setuptools]
packages = ["rwth_tui"]
